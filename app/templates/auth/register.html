{% extends "base.html" %}
{% block title %}Register — TaskForge{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-brand">
    <span class="brand-icon">⬡</span>
    <span class="brand-name">TaskForge</span>
  </div>

  <div class="auth-card">
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Start managing your tasks today</p>

    <form id="registerForm" class="auth-form">
      <div class="field">
        <label class="field__label">Username</label>
        <input type="text" id="username" name="username" class="field__input" placeholder="john_doe" required autocomplete="username" />
      </div>
      <div class="field">
        <label class="field__label">Email</label>
        <input type="email" id="email" name="email" class="field__input" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="field__label">Password</label>
        <input type="password" id="password" name="password" class="field__input" placeholder="Min. 6 characters" required autocomplete="new-password" />
      </div>
      <div id="formError" class="form-error hidden"></div>
      <button type="submit" class="btn btn--primary btn--full" id="submitBtn">
        <span>Create Account</span>
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('formError');
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Creating…';
  err.classList.add('hidden');

  const res = await fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });
  const data = await res.json();

  if (data.success) {
    window.location.href = '/';
  } else {
    err.textContent = data.message;
    err.classList.remove('hidden');
    btn.disabled = false;
    btn.querySelector('span').textContent = 'Create Account';
  }
});
</script>
{% endblock %}
